name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动输入版本号 (如: 2.0.0)'
        required: false
        type: string

env:
  NODE_VERSION: '20'

jobs:
  # 准备工作 - 获取版本号
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="test-build"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本: $VERSION"

  # Linux 构建 (deb + AppImage)
  build-linux:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libgtk-3-dev libnotify-dev \
            libnss3 libxss1 libasound2 libxtst6 xauth \
            xvfb libdrm2 libgbm1 libgl1-mesa-glx libgl1-mesa-dri \
            libsecret-1-dev

      - name: Build Linux
        env:
          NODE_ENV: production
        run: pnpm build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            release/*.deb
            release/*.AppImage
          retention-days: 30

  # Windows 构建 (NSIS 安装程序 + 便携包)
  build-windows:
    needs: prepare
    runs-on: windows-2022
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows
        env:
          NODE_ENV: production
        run: pnpm build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            release/*.exe
          retention-days: 30

  # macOS 构建 (可选)
  build-macos:
    needs: prepare
    runs-on: macos-14
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS
        env:
          NODE_ENV: production
        run: pnpm build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            release/*.dmg
          retention-days: 30

  # 发布 Release
  release:
    needs: [prepare, build-linux, build-windows, build-macos]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/linux-builds/*.deb
            artifacts/linux-builds/*.AppImage
            artifacts/windows-builds/*.exe
            artifacts/macos-builds/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 测试构建（非 Release）
  test-build:
    needs: [prepare, build-linux, build-windows]
    if: needs.prepare.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List test artifacts
        run: |
          echo "=== Linux Builds ==="
          ls -la artifacts/linux-builds/ || echo "No Linux builds"
          echo ""
          echo "=== Windows Builds ==="
          ls -la artifacts/windows-builds/ || echo "No Windows builds"
